name: Deploy ZeroBrain showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify showcase assets
        run: |
          node scripts/build-showcase.cjs --check
          node scripts/build-atlas.cjs --check
      - name: Upload static showcase only
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
