    <path d="M690 335 V240" stroke="#00c758"/>
    <path d="M850 370 H805" stroke="#35e0e8"/>
    <path d="M690 65 V150" stroke="#edb200"/>
    <path d="M805 390 H850" stroke="#35e0e8"/>
  </g>
