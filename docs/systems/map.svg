    <rect x="850" y="150" width="230" height="90" rx="4"/>
    <rect x="30" y="335" width="225" height="90" rx="4"/>
    <rect x="300" y="335" width="230" height="90" rx="4"/>
    <rect x="575" y="335" width="230" height="90" rx="4"/>
  </g>
  <g fill="#1b1b21" stroke="#ece8e1" stroke-width="2">
    <rect x="850" y="335" width="230" height="90" rx="4"/>
    <rect x="856" y="341" width="218" height="78" rx="2"/>
  </g>
  <g fill="#ece8e1" font-family="system-ui, sans-serif" font-size="20">
    <text x="593" y="44">Operator + OPA</text>
    <text x="48" y="184">Research / Spyglass</text><text x="48" y="215">Retrieve, then verify</text>
    <text x="318" y="184">RFC team input</text><text x="318" y="215">Waves + decision</text>
    <text x="593" y="184">Scoped work</text><text x="593" y="215">Tasks / SWATs</text>
