    <text x="48" y="369">Cairn records</text><text x="48" y="400">Rationale + revisions</text>
    <text x="318" y="369">Agent continuity</text><text x="318" y="400">Identity / handoff</text>
    <text x="593" y="369">Coordinator</text><text x="593" y="400">Operational records</text>
    <text x="868" y="369">Superdash</text><text x="868" y="400">Included reference UI</text>
  </g>
  <g fill="#a9a29a" font-family="Consolas, monospace" font-size="16">
