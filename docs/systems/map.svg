<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">COHORT work and evidence handoffs</title>
  <desc id="map-desc">Operator authority bounds the coordinator. Research retrieves Cairn-backed context; proposals take in the team's input before scoped work and independent review. Agent continuity supports execution. Superdash displays records without owning them. The textual handoff list below provides the same relationships.</desc>
